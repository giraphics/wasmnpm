name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            **/cpm_modules
            **/node_modules
          key: cpm-node-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/yarn.lock') }}

      # Emscripten 2.0.31 generates JavaScript for the Node of its era. CMake
      # runs `node WasmModuleDeclarations.js` to emit the .d.ts, so the Node on
      # PATH has to be old enough to execute that output.
      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - uses: mymindstorm/setup-emsdk@v10
        with:
          version: 2.0.31

      # emsdk bundles its own Node and may put it ahead on PATH; this records
      # which one actually runs the generated module.
      - name: Toolchain versions
        run: |
          which -a node
          node --version
          echo "EMSDK_NODE=$EMSDK_NODE"
          "${EMSDK_NODE:-node}" --version || true

      - name: Install C++/CMake style checkers
        run: pip3 install clang-format==14.0.6 cmake_format==0.6.11 pyyaml

      - name: install
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
        run: yarn install

      - name: test
        run: yarn run test

      - name: check style
        run: yarn run check:style
